# Publishes the VS Code extension to the Visual Studio Marketplace
# with Trusted Publishing (OpenID Connect), so no access token is stored
# anywhere.
#
# One-time setup:
#   1. On https://marketplace.visualstudio.com/manage, publisher "NicolasVaughan":
#      add a Trusted Publishing policy for the GitHub repository
#      nivaca/py-schematron-vscode and the workflow file publish-vscode.yml.
#   2. On GitHub, Settings > Secrets and variables > Actions > Variables:
#      add VSCE_TRUSTED_PUBLISHING with the value true.
# Until then the workflow only tests and packages the extension.
#
# It runs when a release tag (v*) is pushed, or by hand from the Actions tab.
# A version already on the Marketplace is skipped.
#
# Optional: to publish to Open VSX too (the store of VSCodium and other
# editors built on VS Code's code):
#   1. Sign in at https://open-vsx.org with GitHub, and sign the Eclipse
#      Foundation's publisher agreement there (Settings > Profile).
#   2. Settings > Access Tokens: create a token.
#   3. On GitHub, Settings > Secrets and variables > Actions > Secrets:
#      add OVSX_PAT with that token.
# The first run creates the namespace NicolasVaughan on Open VSX. To publish
# a version already tagged, run this workflow by hand on its tag.

name: Publish VS Code extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # (Trusted Publishing)

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check that the tag matches package.json
        if: startsWith(github.ref_name, 'v')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but package.json says $version"
            exit 1
          fi

      - name: Package
        run: npx vsce package -o extension.vsix

      - name: Publish to the Visual Studio Marketplace
        if: vars.VSCE_TRUSTED_PUBLISHING == 'true'
        run: npx vsce publish --oidc --skip-duplicate --packagePath extension.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          publisher="$(node -p "require('./package.json').publisher")"
          if ! curl -sf "https://open-vsx.org/api/$publisher" >/dev/null; then
            npx --yes ovsx create-namespace "$publisher"
          fi
          npx --yes ovsx publish extension.vsix --skip-duplicate
