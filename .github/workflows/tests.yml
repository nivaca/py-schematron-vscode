# Compiles the extension and runs its unit tests on every push and pull
# request. (publish-vscode.yml runs them too, on release tags, before it
# publishes.)

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install
        run: |
          npm ci
          python -m pip install saxonche lxml

      - name: Test
        run: |
          export VALIDATE_PYTHON="$(command -v python)"
          npm test
