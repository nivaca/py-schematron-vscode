# Compiles the extension and runs its unit tests, and runs it inside a real
# VS Code, on every push and pull request: on Linux and Windows, and also on
# macOS for release tags, the Monday run and runs started by hand (GitHub
# often has no Mac free, and then cancels the job after a long wait, which
# fails the whole run for nothing). (publish-vscode.yml runs the unit tests
# too, on release tags, before it publishes.)

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays: catches what changes upstream with no push here (the TEI
    # Stylesheets' dev branch, new saxonche or lxml, VS Code, npm)
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install
        run: |
          npm ci
          python -m pip install saxonche lxml

      - name: Unit tests
        run: |
          export VALIDATE_PYTHON="$(command -v python)"
          npm test

      - name: In a real VS Code (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: |
          export VALIDATE_PYTHON="$(command -v python)"
          xvfb-run -a npm run test:integration

      - name: In a real VS Code (macOS, Windows)
        if: runner.os != 'Linux'
        run: |
          export VALIDATE_PYTHON="$(command -v python)"
          npm run test:integration
